<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Хим-Физ сектор — Sezan Industries</title>
<style>
  body { background: #050a0e; color: #e0f7fa; font-family: 'Courier New', monospace; margin: 0; padding-bottom: 80px; }
  .top { background: #0a141c; border-bottom: 2px solid #00e5ff; padding: 12px 16px; display: flex; justify-content: space-between; }
  .wrap { max-width: 850px; margin: 16px auto; padding: 0 16px; }
  .card { background: #0a141c; border: 1px solid #006064; border-radius: 8px; padding: 18px; }
  h2 { color: #00e5ff; margin-top: 0; }
  input, textarea { width: 100%; padding: 10px; background: #03070a; border: 1px solid #006064; color: #fff; margin: 6px 0 12px; box-sizing: border-box; }
  button { background: #00e5ff; color: #050a0e; font-weight: bold; border: none; padding: 10px 16px; cursor: pointer; }
  .log { border-left: 2px solid #00e5ff; padding: 8px 12px; background: #070e14; margin-top: 10px; font-size: 13px; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #03070a; border-top: 1px solid #00e5ff; display: flex; justify-content: space-around; padding: 8px 4px; font-family: sans-serif; z-index: 10; }
  .nav a { color: #4dd0e1; text-decoration: none; font-size: 11px; text-align: center; min-width: 55px; }
  .nav a.act { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div class="top">
  <b style="color:#00e5ff">🧪 SEZAN // LAB-SECTOR</b>
  <a href="constitution.html" style="color:#d4af37;font-size:12px;text-decoration:none">← Выход</a>
</div>
<div class="wrap">
  <div class="card">
    <h2>Журнал лабораторных испытаний (Химия / Физика / Механика)</h2>
    <input type="text" id="exp-t" placeholder="Название опыта или расчёта">
    <textarea id="exp-d" rows="2" placeholder="Формулы, наблюдения и результаты..."></textarea>
    <button type="button" onclick="addLog()">Записать в журнал</button>
    <div id="logs"></div>
  </div>
</div>
<div class="nav">
  <a href="sezan_index.html">🧬<br>Проекты</a>
  <a href="sezan_it.html">💻<br>ИТ-отдел</a>
  <a href="sezan_chem.html" class="act">🧪<br>Хим-Физ</a>
  <a href="sezan_archive.html">📁<br>Архив</a>
  <a href="sezan_chat.html">💬<br>Связь</a>
</div>
<script>
  var cur = JSON.parse(localStorage.getItem('ko_v5_cur')) || { fullName: 'Сотрудник' };
  var db = JSON.parse(localStorage.getItem('ko_v5_db')) || { sezanLogs: [] };
  if (!db.sezanLogs) db.sezanLogs = [];

  function render() {
    document.getElementById('logs').innerHTML = db.sezanLogs.slice().reverse().map(function(l) {
      return '<div class="log"><b style="color:#00e5ff">' + l.t + '</b> (' + l.u + ')<br>' + l.d + '</div>';
    }).join('');
  }
  function addLog() {
    var t = document.getElementById('exp-t').value.trim();
    var d = document.getElementById('exp-d').value.trim();
    if (!t || !d) return;
    db.sezanLogs.push({ t: t, d: d, u: cur.fullName });
    localStorage.setItem('ko_v5_db', JSON.stringify(db));
    document.getElementById('exp-t').value = ''; document.getElementById('exp-d').value = '';
    render();
  }
  render();
</script>
<script src="theme.js"></script>
</body>
</html>
