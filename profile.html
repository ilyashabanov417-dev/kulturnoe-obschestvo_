<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Личный профиль — Культурное общество</title>
<style>
  body { background: #0b1110; color: #f2f5f4; font-family: sans-serif; margin: 0; padding-bottom: 85px; }
  .top { background: #141f1c; border-bottom: 1px solid #d4af37; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
  .wrap { max-width: 800px; margin: 16px auto; padding: 0 16px; }
  .card { background: #141f1c; border: 1px solid #263833; border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  h2, h3 { color: #d4af37; margin-top: 0; }
  .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; background: #0b1110; padding: 14px; border-radius: 10px; border: 1px solid #263833; font-size: 14px; }
  button { background: #d4af37; color: #090e0d; font-weight: bold; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 6px; margin-right: 6px; }
  button.btn-red { background: #e05252; color: #fff; }
  input { width: 100%; padding: 10px; margin: 6px 0 12px; background: #0b1110; border: 1px solid #263833; color: #fff; border-radius: 8px; box-sizing: border-box; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #090e0d; border-top: 1px solid #263833; display: flex; justify-content: space-around; padding: 8px 4px; overflow-x: auto; z-index: 10; }
  .nav a { color: #94a39f; text-decoration: none; font-size: 11px; text-align: center; min-width: 50px; }
  .nav a.act { color: #d4af37; font-weight: bold; }
</style>
</head>
<body>
<div class="top">
  <b style="color:#d4af37">👤 Личный профиль</b>
  <span style="background:rgba(212,175,55,0.15);border:1px solid #d4af37;color:#d4af37;padding:4px 10px;border-radius:16px;font-size:13px">🪙 <b id="coins">0</b> Культур</span>
</div>

<div class="wrap">
  <div class="card">
    <h2 id="p-name">Участник</h2>
    <div class="info-grid">
      <div>Логин: <b id="p-login">-</b></div>
      <div>Класс: <b id="p-cls">-</b></div>
      <div>Статус: <b id="p-st" style="color:#d4af37">-</b></div>
      <div>Должности: <b id="p-roles" style="color:#81c784">-</b></div>
      <div>Баланс: <b id="p-coins" style="color:#d4af37">0 🪙</b></div>
      <div>Скин Мафии: <b id="p-skin">-</b></div>
      <div>Выговоры: <b id="p-warns" style="color:#e05252">0 / 3</b></div>
    </div>
  </div>

  <div class="card">
    <h3>⚙️ Настройки безопасности</h3>
    <input type="password" id="np" placeholder="Новый пароль">
    <button type="button" onclick="chPass()">Сменить пароль</button>
    <button type="button" class="btn-red" onclick="out()">Выйти из аккаунта</button>
  </div>
</div>

<div class="nav">
  <a href="constitution.html">📜<br>Законы</a>
  <a href="booking.html">📅<br>Приём</a>
  <a href="messenger.html">💬<br>Чат</a>
  <a href="library.html">📚<br>Книги</a>
  <a href="shop.html">🛒<br>Магазин</a>
  <a href="mafia.html">🎭<br>Мафия</a>
  <a href="sezan_index.html" style="color:#00e5ff">🧬<br>Sezan</a>
  <a href="profile.html" class="act">👤<br>Профиль</a>
  <a href="admin.html" style="color:#d4af37">👑<br>Админ</a>
</div>

<script>
  var dbKey = localStorage.getItem('ko_v5_db') ? 'ko_v5_db' : (localStorage.getItem('ko_v4_db') ? 'ko_v4_db' : 'ko_v5_db');
  var curKey = localStorage.getItem('ko_v5_cur') ? 'ko_v5_cur' : (localStorage.getItem('ko_v4_cur') ? 'ko_v4_cur' : 'ko_v5_cur');

  var cur = JSON.parse(localStorage.getItem(curKey));
  if (!cur) window.location.href = 'index.html';
  var db = JSON.parse(localStorage.getItem(dbKey)) || { users: [] };
  var meIdx = db.users.findIndex(function(u) { return u.id === cur.id || u.login === cur.login; });
  var me = meIdx !== -1 ? db.users[meIdx] : cur;

  function saveMe() {
    if (meIdx !== -1) db.users[meIdx] = me;
    localStorage.setItem('ko_v5_db', JSON.stringify(db));
    localStorage.setItem('ko_v5_cur', JSON.stringify(me));
    if (localStorage.getItem('ko_v4_db')) {
      localStorage.setItem('ko_v4_db', JSON.stringify(db));
      localStorage.setItem('ko_v4_cur', JSON.stringify(me));
    }
  }

  function render() {
    var c = me.coins || 0;
    document.getElementById('coins').textContent = c;
    document.getElementById('p-coins').textContent = c + ' 🪙';
    document.getElementById('p-name').textContent = me.fullName;
    document.getElementById('p-login').textContent = me.login;
    document.getElementById('p-cls').textContent = me.cls;
    document.getElementById('p-st').textContent = me.status;
    document.getElementById('p-skin').textContent = me.activeSkin || '👤 Стандартный';
    document.getElementById('p-warns').textContent = (me.warns || 0) + ' / 3';

    var roles = [];
    if (me.isAdmin) roles.push('Админ');
    if (me.isSezan) roles.push('Sezan (' + (me.sezanRole || 'Сотрудник') + ')');
    if (me.isLib) roles.push('Библиотекарь');
    document.getElementById('p-roles').textContent = roles.length ? roles.join(', ') : 'Участник';
  }

  function chPass() {
    var np = document.getElementById('np').value.trim();
    if (!np) return;
    me.pass = np;
    saveMe();
    document.getElementById('np').value = '';
    alert('Пароль успешно изменён!');
  }

  function out() {
    localStorage.removeItem('ko_v5_cur');
    localStorage.removeItem('ko_v4_cur');
    window.location.href = 'index.html';
  }

  render();
</script>
<script src="theme.js"></script>
</body>
</html>
