<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИТ-отдел — Sezan Industries</title>
<style>
  body { background: #050a0e; color: #e0f7fa; font-family: 'Courier New', monospace; margin: 0; padding-bottom: 80px; }
  .top { background: #0a141c; border-bottom: 2px solid #00e5ff; padding: 12px 16px; display: flex; justify-content: space-between; }
  .wrap { max-width: 850px; margin: 16px auto; padding: 0 16px; }
  .card { background: #0a141c; border: 1px solid #006064; border-radius: 8px; padding: 18px; }
  h2 { color: #00e5ff; margin-top: 0; }
  textarea, input { width: 100%; padding: 10px; background: #03070a; border: 1px solid #006064; color: #00e5ff; margin: 6px 0 12px; box-sizing: border-box; font-family: monospace; }
  button { background: #00e5ff; color: #050a0e; font-weight: bold; border: none; padding: 10px 16px; cursor: pointer; }
  .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #03070a; border-top: 1px solid #00e5ff; display: flex; justify-content: space-around; padding: 8px 4px; font-family: sans-serif; z-index: 10; }
  .nav a { color: #4dd0e1; text-decoration: none; font-size: 11px; text-align: center; min-width: 55px; }
  .nav a.act { color: #fff; font-weight: bold; }
</style>
</head>
<body>
<div class="top">
  <b style="color:#00e5ff">💻 SEZAN // IT-LAB</b>
  <a href="constitution.html" style="color:#d4af37;font-size:12px;text-decoration:none">← Выход</a>
</div>
<div class="wrap">
  <div class="card">
    <h2>Шифратор сообщений (Протокол Закона 9)</h2>
    <p style="font-size:13px">Используйте терминал для кодирования секретных данных перед отправкой.</p>
    <textarea id="src" rows="3" placeholder="Введите текст для шифрования или код для расшифровки..."></textarea>
    <button type="button" onclick="enc()">Зашифровать</button>
    <button type="button" style="background:#4dd0e1" onclick="dec()">Расшифровать</button>
    <textarea id="out" rows="3" readonly style="margin-top:12px" placeholder="Результат..."></textarea>
  </div>
</div>
<div class="nav">
  <a href="sezan_index.html">🧬<br>Проекты</a>
  <a href="sezan_it.html" class="act">💻<br>ИТ-отдел</a>
  <a href="sezan_chem.html">🧪<br>Хим-Физ</a>
  <a href="sezan_archive.html">📁<br>Архив</a>
  <a href="sezan_chat.html">💬<br>Связь</a>
</div>
<script>
  function enc() {
    var s = document.getElementById('src').value;
    document.getElementById('out').value = btoa(unescape(encodeURIComponent(s)));
  }
  function dec() {
    try {
      var s = document.getElementById('src').value;
      document.getElementById('out').value = decodeURIComponent(escape(atob(s)));
    } catch(e) { alert('Неверный формат шифра!'); }
  }
</script>
<script src="theme.js"></script>
</body>
</html>
